name: CI — Notebook Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Kütüphaneleri yükle
        run: |
          pip install -r requirements.txt
          pip install nbconvert nbformat ipykernel
          python -m ipykernel install --user --name python3

      - name: 🔧 Kernel adını düzelt
        run: |
          python - <<'EOF'
          import json, glob
          for path in glob.glob("*.ipynb"):
              nb = json.load(open(path))
              nb["metadata"]["kernelspec"] = {
                  "display_name": "Python 3",
                  "language": "python",
                  "name": "python3"
              }
              json.dump(nb, open(path, "w"))
              print(f"✅ Kernel düzeltildi: {path}")
          EOF

      - name: 📓 Notebook'u çalıştır
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            --inplace \
            *.ipynb

      - name: ✅ Başarılı
        run: echo "Notebook hatasız çalıştı!"
        
